    <title>Document</title>

  <body>
    <!-- getElementById() -->
    <!-- ésto es un nodo de tipo comentario -->
    <h1 id="h1">Hola</h1>

    <!-- getElementByTagName() -->
    <h2>Chau</h2>
    <h2>Alumnos</h2>

    <!-- getElementByClassName() -->
    <button class="btn">Ver Más</button>
    <button class="btn">Ver Más</button>
    <button class="btn">Ver Más</button>

    <!-- querySelector() -->
    <div id="contenedor">Lorem, ipsum dolor.</div>
    <div class="container">Lorem, ipsum dolor.</div>

    <!-- querySelectorAll() -->
    <button class="button">Contactar</button>
    <button class="button">Contactar</button>
    <button class="button">Contactar</button>

    <!-- Modificar nodos -->

    <p id="miParrafo">Hola Queridos alumnos!</p>

    <!-- Rescatando un datos de un input -->
    <!-- <input id="input" type="text" /> -->

    <!-- innerHTML -->
    <div id="miContenedor"></div>

    <!-- Ejemplo Final -->
    <h1 id="titulo"></h1>
    <p class="descripcion"></p>
    <img src="" alt="" />

    <script src="./app.js"></script>
