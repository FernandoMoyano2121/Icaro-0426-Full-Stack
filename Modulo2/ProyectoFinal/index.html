<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="./node_modules/bootstrap/dist/css/bootstrap.css"
    />
    <title>Document</title>
  </head>
  <body>
    <div class="container">
      <h1>Gestion de tareas</h1>

      <!-- titulo -->
      <div class="mb-3 card p-4 shadow">
        <label for="nombreTarea">Ingresa la tarea</label>
        <input
          class="form-control"
          type="text"
          id="nombreTarea"
          placeholder="Nombre de la tarea"
        />
      </div>

      <!-- Prioridad -->
      <div class="mb-3 card p-4 shadow">
        <label class="form-label" for="prioridadTarea"
          >Selecciona la prioridad</label
        >
        <select class="form-select" id="prioridadTarea">
          <option value="Alta">Alta</option>
          <option value="Media">Media</option>
          <option value="Baja">Baja</option>
        </select>
      </div>

      <!-- Vencimiento -->
      <div class="mb-3 card p-4 shadow">
        <label class="form-label" for="fechaVencimiento"
          >Fecha de vencimiento:</label
        >
        <input class="form-control" type="date" id="fechaVencimiento" />
      </div>

      <!-- Agregar -->
      <button class="btn btn-warning" id="agregarTarea">Agregar</button>

      <!-- Listado de tareas -->
      <div class="mt-5">
        <h2>Listado de tareas</h2>
        <ul class="list-group" id="listadoTareas">
          <!-- items de tarea -->
        </ul>

        <span class="mt-3" id="tareasPendientes">
          <!-- tareas pendientes -->
        </span>
      </div>
    </div>

    <script type="module" ="./src/app.js"></script>
  </body>
</html>
