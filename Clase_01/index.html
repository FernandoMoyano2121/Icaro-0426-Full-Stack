<!-- Declara que este archivo es una página web HTML -->
<!doctype html>
<!-- Comienza el documento HTML (lang="en" indica que el idioma es inglés) -->
<html lang="en">
  <!-- Encabezado: datos de la página (no se ven en el navegador) -->
  <head>
    <!-- Define la codificación de caracteres (UTF-8 = soporte para múltiples idiomas) -->
    <meta charset="UTF-8" />
    <!-- Hace que la página se adapte bien a dispositivos móviles -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Título que aparece en la pestaña del navegador -->
    <title>Document</title>
  </head>
  <!-- Comienza el cuerpo: aquí va lo que se ve en la página -->
  <body>
    <!-- Párrafo simple de texto -->
    <p>Hola alumnos!</p>

    <!-- Encabezado de la página (navegación y logo típicamente) -->
    <header>
      <!-- Barra de navegación (menú) -->
      <nav></nav>
    </header>

    <!-- Contenido principal de la página -->
    <main>
      <!-- Sección: agrupa contenido relacionado -->
      <section>
        <!-- Título grande (h1 = más importante) -->
        <h1>Fernando Moyano</h1>
        <!-- Subtítulo (h2 = menos importante que h1) -->
        <h2>Sobre mi</h2>
        <!-- Párrafo con texto de descripción -->
        <p>
          Lorem ipsum dolor sit amet consectetur adipisicing elit. Adipisci
          ratione sequi modi numquam facere asperiores vitae molestias quos
          deserunt eaque!
        </p>
      </section>
    </main>
    <!-- Pie de página (información final, copyright, etc.) -->
    <footer>Pie de pagina</footer>
  </body>
  <!-- Cierra el documento HTML -->
</html>
